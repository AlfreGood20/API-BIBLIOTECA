info:
  name: obtener-libros
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL-API}}/libros/public"
  params:
    - name: titulo
      value: ""
      type: query
      description: Obtener por iniciales del titulo del libro.
      disabled: true
    - name: isbn
      value: ""
      type: query
      description: Obtener por isbn.
      disabled: true
    - name: categoriaId
      value: ""
      type: query
      description: Obtener por el id de la categoria.
      disabled: true
    - name: EditorialId
      value: ""
      type: query
      description: Obtener por el id del editorial.
      disabled: true
    - name: idiomaId
      value: ""
      type: query
      description: Obtener por id del idioma.
      disabled: true
    - name: page
      value: "0"
      type: query
      description: Obtener por numero de pagina dependiendo el numero de total de paginas.
      disabled: true
    - name: size
      value: "5"
      type: query
      description: Obtener el maximo de elementos a recibir.
      disabled: true
    - name: sort
      value: id,asc
      type: query
      description: Obtener por orden. Por asc (ascendente) o desc (descendiente).
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
