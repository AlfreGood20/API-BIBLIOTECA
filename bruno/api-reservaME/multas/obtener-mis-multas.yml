info:
  name: obtener-mis-multas
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL-API}}/multas/usuario"
  params:
    - name: estado
      value: PENDIENTE
      type: query
      disabled: true
    - name: estado
      value: PAGADA
      type: query
      disabled: true
    - name: estado
      value: CONDONADA
      type: query
      disabled: true
    - name: page
      value: "0"
      type: query
      description: Obtener por numero de pagina dependiendo el numero de total de paginas.
      disabled: true
    - name: size
      value: "5"
      type: query
      description: Obtener el maximo de elementos a recibir.
      disabled: true
    - name: sort
      value: id,asc
      type: query
      description: Obtener por orden. Por asc (ascendente) o desc (descendiente).
      disabled: true
  auth:
    type: bearer
    token: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
