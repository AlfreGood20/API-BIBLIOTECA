info:
  name: obtener-mis-reservas
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL-API}}/reservas/usuario"
  params:
    - name: estado
      value: PENDIENTE
      type: query
      description: Obtener solo los pendientes.
      disabled: true
    - name: estado
      value: ENTREGADA
      type: query
      description: Obtener solo los entregadas.
      disabled: true
    - name: estado
      value: DISPONIBLE
      type: query
      description: Obtener solo los disponibles.
      disabled: true
    - name: estado
      value: CANCELADA
      type: query
      description: Obtener solo los canceladas.
      disabled: true
    - name: estado
      value: EXPIRADA
      type: query
      description: Obtener solo los expiradas.
      disabled: true
    - name: page
      value: "0"
      type: query
      description: Obtener por numero de pagina dependiendo el numero de total de paginas.
      disabled: true
    - name: size
      value: "5"
      type: query
      description: Obtener el maximo de elementos a recibir.
      disabled: true
    - name: sort
      value: id,asc
      type: query
      description: Obtener por orden. Por asc (ascendente) o desc (descendiente).
      disabled: true
  auth:
    type: bearer
    token: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
